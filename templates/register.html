<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل جديد</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background-image: url('https://images.unsplash.com/photo-1615971677499-5467cbab01c0?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center; }
        .glass-container { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); text-align: center; color: white; width: 90%; max-width: 400px; border: 1px solid rgba(212, 175, 55, 0.3); }
        .title { color: #d4af37; font-size: 28px; margin-bottom: 20px; font-weight: bold; }
        input { width: 90%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #d4af37; background: rgba(255,255,255,0.9); font-size: 16px; }
        .btn { background: linear-gradient(45deg, #d4af37, #b8860b); color: black; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; width: 100%; font-weight: bold; }
        .btn:hover { transform: scale(1.02); }
        a { color: #d4af37; text-decoration: none; font-weight: bold; }
        .error { color: #ff4444; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="glass-container">
        <h2 class="title">إنشاء حساب جديد</h2>
        {% if error %} <p class="error">{{ error }}</p> {% endif %}
        <form method="post" action="/register">
            <input type="text" name="name" placeholder="الاسم الكامل" required>
            <input type="tel" name="phone" placeholder="رقم الهاتف" required>
            <input type="text" name="country" placeholder="الدولة" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit" class="btn">تسجيل</button>
        </form>
        <p>لديك حساب؟ <a href="/login">دخول</a></p>
    </div>
</body>
</html>
