<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سعر الصرف - سباهية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; margin: 0; background-color: #f4f4f4; color: #333; direction: rtl; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.85); padding: 15px 20px; }
        .logo { font-size: 22px; font-weight: bold; color: #d4af37; }
        .menu-btn { background: none; border: none; font-size: 30px; cursor: pointer; color: #d4af37; }
        .sidebar { position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: #1a3c34; color: white; transition: left 0.3s ease; z-index: 200; padding: 20px; box-sizing: border-box; }
        .sidebar.open { left: 0; }
        .sidebar a { color: white; text-decoration: none; font-size: 18px; font-weight: bold; display: block; padding: 10px; border-radius: 8px; }
        .sidebar a:hover { background: #d4af37; color: black; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 150; display: none; }
        .overlay.show { display: block; }
        .container { max-width: 600px; margin: 40px auto; padding: 20px; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .rate-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; font-size: 18px; }
        .rate-item:last-child { border-bottom: none; }
        .rate-label { color: #555; }
        .rate-value { font-weight: bold; color: #1a3c34; }
        .rate-value.sell { color: #c62828; }
        .update-time { font-size: 14px; color: #999; margin-top: 20px; }
        .loading { font-size: 18px; color: #d4af37; font-weight: bold; }
    </style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <h2 style="color:#d4af37;">القائمة</h2>
        <ul style="list-style:none; padding:0;">
            <li style="margin-bottom:15px;"><a href="/" style="color:white; text-decoration:none; font-size:18px; font-weight:bold; display:block; padding:10px;">🏠 الصفحة الرئيسية</a></li>
            <li style="margin-bottom:15px;"><a href="/forum" style="color:white; text-decoration:none; font-size:18px; font-weight:bold; display:block; padding:10px;">💬 الدردشة</a></li>
            <li style="margin-bottom:15px;"><a href="/draw" style="color:white; text-decoration:none; font-size:18px; font-weight:bold; display:block; padding:10px;">🎨 الرسم المشترك</a></li>
            <li style="margin-bottom:15px;"><a href="/referral" style="color:#d4af37; text-decoration:none; font-size:18px; font-weight:bold; display:block; padding:10px;">💰 الإحالة</a></li>
            <li style="margin-bottom:15px;"><a href="/exchange_rate" style="color:white; text-decoration:none; font-size:18px; font-weight:bold; display:block; padding:10px;">💱 سعر الصرف</a></li>
            <li><a href="/logout" style="color:white; text-decoration:none; font-size:18px; font-weight:bold; display:block; padding:10px;">🚪 تسجيل الخروج</a></li>
        </ul>
    </div>
    <div class="navbar">
        <div class="logo">🏛️ سباهية - سعر الصرف</div>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
    <div class="container">
        <div class="card" id="rateCard">
            <p class="loading">⏳ جاري تحميل الأسعار...</p>
        </div>
    </div>
    <script>
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }
        async function fetchRates() {
            try {
                const response = await fetch('/api/usd_rate');
                const data = await response.json();
                const card = document.getElementById('rateCard');
                if (data.error) {
                    card.innerHTML = '<p style="color:red;">تعذر جلب الأسعار. يرجى المحاولة لاحقاً.</p>';
                    return;
                }
                card.innerHTML = '<h2 style="color: #d4af37;">سعر الدولار الأمريكي في سوريا</h2>' +
                    '<div class="rate-item"><span class="rate-label">💵 سعر الشراء:</span><span class="rate-value">' + data.buy + ' ل.س</span></div>' +
                    '<div class="rate-item"><span class="rate-label">💰 سعر البيع:</span><span class="rate-value sell">' + data.sell + ' ل.س</span></div>' +
                    '<p class="update-time">آخر تحديث: ' + data.last_updated + '</p>';
            } catch (e) {
                document.getElementById('rateCard').innerHTML = '<p style="color:red;">خطأ في الاتصال بالخادم.</p>';
            }
        }
        window.onload = fetchRates;
        setInterval(fetchRates, 60000);
    </script>
</body>
</html>
