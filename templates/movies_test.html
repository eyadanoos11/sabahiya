<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأفلام - سباهية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; margin: 0; background: #0d1f1a; color: white; direction: rtl; min-height: 100vh; }
        
        /* الشريط العلوي */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(90deg, #1a3c34, #2e5d4a); padding: 15px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100; border-bottom: 3px solid #d4af37; }
        .logo { font-size: 22px; font-weight: 900; color: #d4af37; display: flex; align-items: center; gap: 10px; }
        .logo-img { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 2px solid #ff0000; }
        .back-btn { background: #d4af37; color: black; padding: 8px 18px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 14px; }
        
        /* العنوان */
        .page-header { text-align: center; padding: 30px 20px 15px; }
        .page-title { color: #d4af37; font-size: 34px; font-weight: 900; margin: 0; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
        .page-subtitle { color: #aaa; font-size: 15px; margin-top: 8px; }
        
        /* شريط البحث */
        .search-box { max-width: 600px; margin: 20px auto; padding: 0 20px; position: relative; }
        .search-input { width: 100%; padding: 14px 50px 14px 20px; background: #1a3c34; border: 2px solid #2e5d4a; border-radius: 30px; color: white; font-family: 'Tajawal', sans-serif; font-size: 16px; transition: all 0.3s; }
        .search-input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 15px rgba(212,175,55,0.3); }
        .search-icon { position: absolute; right: 38px; top: 50%; transform: translateY(-50%); color: #d4af37; font-size: 18px; pointer-events: none; }
        
        /* شبكة الأفلام */
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        .movie-card { background: #1a3c34; border-radius: 15px; overflow: hidden; cursor: pointer; transition: all 0.3s; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .movie-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 10px 30px rgba(212,175,55,0.4); }
        
        .poster-container { position: relative; width: 100%; height: 240px; overflow: hidden; background: #0d1f1a; }
        .poster-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .movie-card:hover .poster-img { transform: scale(1.1); }
        .poster-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: #d4af37; font-size: 60px; background: linear-gradient(135deg, #0d1f1a, #1a3c34); }
        
        /* شارة السنة على الصورة */
        .year-badge { position: absolute; top: 10px; right: 10px; background: rgba(212,175,55,0.95); color: black; padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        
        /* شارة المشاهدة */
        .play-overlay { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #d4af37; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        
        /* معلومات الفيلم */
        .movie-info { padding: 12px; text-align: center; }
        .movie-title { font-size: 15px; font-weight: bold; color: white; margin: 0 0 5px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 40px; }
        .movie-year-text { font-size: 12px; color: #d4af37; }
        
        /* رسالة لا توجد نتائج */
        .no-results { text-align: center; padding: 60px 20px; color: #666; font-size: 18px; grid-column: 1/-1; }
        
        /* نافذة الفيديو المنبثقة */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-content { background: #1a3c34; border-radius: 20px; padding: 20px; max-width: 700px; width: 100%; position: relative; }
        .modal-close { position: absolute; top: 10px; left: 10px; background: #ff0000; color: white; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 20px; cursor: pointer; font-weight: bold; z-index: 10; }
        .modal-title { color: #d4af37; font-size: 22px; font-weight: bold; margin: 0 0 15px; text-align: center; padding: 0 40px; }
        .modal-poster { width: 100%; max-height: 300px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        .modal-info { color: #aaa; text-align: center; margin-bottom: 20px; font-size: 14px; }
        .modal-watch-btn { display: block; background: linear-gradient(45deg, #d4af37, #b8860b); color: black; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 18px; text-decoration: none; text-align: center; transition: all 0.3s; }
        .modal-watch-btn:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(212,175,55,0.5); }
        
        @media (max-width: 480px) {
            .movies-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; }
            .poster-container { height: 200px; }
            .movie-title { font-size: 13px; min-height: 36px; }
            .page-title { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img src="https://lh3.googleusercontent.com/d/1gexLxzMHdjndfzzl7Wo9w8PPBC29GKFU" class="logo-img">
            <span>سباهية - الأفلام</span>
        </div>
        <a href="/" class="back-btn">🏠 الرئيسية</a>
    </div>

    <div class="page-header">
        <h1 class="page-title">🎬 مكتبة الأفلام</h1>
        <p class="page-subtitle">اضغط على أي فيلم للمشاهدة</p>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن فيلم..." oninput="filterMovies()">
        <span class="search-icon">🔍</span>
    </div>

    <div class="movies-grid" id="moviesGrid"></div>

    <!-- نافذة العرض المنبثقة -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2 class="modal-title" id="modalTitle"></h2>
            <img id="modalPoster" class="modal-poster" style="display:none;">
            <div class="modal-info" id="modalInfo"></div>
            <button id="modalWatchBtn" class="modal-watch-btn" onclick="openMovieUrl(document.getElementById('modalWatchBtn').dataset.url)">🎥 مشاهدة الفيلم الآن</a>
        </div>
    </div>

    <script>
        // ========================================
        // 📌 قائمة الأفلام - أضف أفلامك هنا
        // ========================================
        const movies = [
            {
                title: "Spider-Man: Brand New Day",
                year: "2026",
                poster: "https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg",
                description: "يعود بيتر باركر لمواجهة تحديات جديدة في عالم مليء بالأبطال الخارقين.",
                category: "أكشن / خيال علمي",
                duration: "2 ساعة 15 دقيقة",
                watch_url: "https://www.od3on.com/watch?o=qA7YvvFMW_R"
            }
        ];

        // عرض الأفلام
        function renderMovies(moviesToRender) {
            const grid = document.getElementById('moviesGrid');
            grid.innerHTML = '';

            if (moviesToRender.length === 0) {
                grid.innerHTML = '<div class="no-results">🔍 لا توجد نتائج مطابقة</div>';
                return;
            }

            moviesToRender.forEach((movie, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openModal(movie);

                const posterHtml = movie.poster 
                    ? `<img src="${movie.poster}" class="poster-img" alt="${movie.title}" onerror="this.outerHTML='<div class=\\'poster-placeholder\\'>🎬</div>'">`
                    : `<div class="poster-placeholder">🎬</div>`;

                card.innerHTML = `
                    <div class="poster-container">
                        ${posterHtml}
                        <div class="year-badge">${movie.year}</div>
                        <div class="play-overlay">▶ مشاهدة</div>
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-year-text">${movie.category || ''}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // البحث
        function filterMovies() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                renderMovies(movies);
                return;
            }
            const filtered = movies.filter(m => 
                m.title.toLowerCase().includes(query) || 
                m.year.includes(query)
            );
            renderMovies(filtered);
        }

        // فتح النافذة المنبثقة
        
        // كشف ما إذا كان الموقع مفتوحاً داخل تطبيق
        function isRunningInApp() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            return /FBAN|FBAV|Instagram|Median|wv|WebView|Android.*Version\/[0-9.]+/.test(ua);
        }

        // فتح الرابط داخل التطبيق إذا كنا فيه
        function openMovieUrl(url) {
            if (isRunningInApp()) {
                window.location.href = url;
            } else {
                window.open(url, '_blank');
            }
        }

        function openModal(movie) {
            document.getElementById('modalTitle').textContent = movie.title;
            document.getElementById('modalInfo').innerHTML = `
                📅 <b>${movie.year}</b> &nbsp;•&nbsp; 
                ⏱️ ${movie.duration || '—'}<br>
                🎭 ${movie.category || '—'}<br><br>
                ${movie.description || ''}
            `;
            
            const poster = document.getElementById('modalPoster');
            if (movie.poster) {
                poster.src = movie.poster;
                poster.style.display = 'block';
            } else {
                poster.style.display = 'none';
            }
            
            document.getElementById('modalWatchBtn').dataset.url = movie.watch_url;
            document.getElementById('movieModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('movieModal').classList.remove('show');
        }

        // إغلاق عند النقر خارج النافذة
        document.getElementById('movieModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // التشغيل الأولي
        renderMovies(movies);
    </script>
</body>
</html>
