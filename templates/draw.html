<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسم الثنائي - سباهية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; margin: 0; background: linear-gradient(135deg, #1a3c34, #2e5d4a); color: white; direction: rtl; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .card { background: rgba(0,0,0,0.7); border: 2px solid #d4af37; border-radius: 20px; padding: 40px 30px; max-width: 450px; width: 100%; text-align: center; }
        h1 { color: #d4af37; font-size: 28px; margin: 0 0 10px; }
        .subtitle { color: #aaa; font-size: 15px; margin-bottom: 30px; line-height: 1.6; }
        .btn { display: block; width: 100%; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; margin-bottom: 15px; font-family: 'Tajawal', sans-serif; text-decoration: none; box-sizing: border-box; transition: all 0.2s; }
        .btn-create { background: linear-gradient(45deg, #d4af37, #b8860b); color: black; }
        .btn-create:hover { transform: scale(1.02); }
        .divider { color: #666; margin: 20px 0; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #2e5d4a; background: #0d1f1a; color: white; font-size: 20px; text-align: center; letter-spacing: 3px; text-transform: uppercase; font-family: 'Tajawal', sans-serif; box-sizing: border-box; margin-bottom: 10px; }
        input:focus { outline: none; border-color: #d4af37; }
        .btn-join { background: #2e5d4a; color: white; border: 2px solid #d4af37; }
        .btn-join:hover { background: #d4af37; color: black; }
        .error { color: #ff4444; background: rgba(255,0,0,0.1); padding: 10px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        .back { color: #d4af37; text-decoration: none; font-size: 14px; display: block; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎨 الرسم الثنائي</h1>
        <p class="subtitle">أنشئ غرفة خاصة وشارك الكود مع صديقك لترسما معاً</p>
        
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        
        <form action="/draw/create" method="post">
            <button type="submit" class="btn btn-create">➕ إنشاء غرفة جديدة</button>
        </form>
        
        <div class="divider">— أو —</div>
        
        <form action="/draw/join" method="post">
            <input type="text" name="room_code" placeholder="أدخل الكود" maxlength="6" required autocomplete="off">
            <button type="submit" class="btn btn-join">🔑 انضم للغرفة</button>
        </form>
        
        <a href="/" class="back">← العودة للرئيسية</a>
    </div>
</body>
</html>
